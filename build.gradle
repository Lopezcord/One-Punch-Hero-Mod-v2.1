plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
group = 'com.example.saitamamod'
version = '1.0.0'
base { archivesName = 'saitama-mod' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client { workingDirectory project.file('run'); mods { saitamamod { source sourceSets.main } } }
        server { workingDirectory project.file('run'); args '--nogui'; mods { saitamamod { source sourceSets.main } } }
    }
}
repositories {
    mavenCentral()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroupByRegex('software\\.bernie.*'); includeGroup('com.eliotlash.mclib') }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup('maven.modrinth') }
    }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.8.5')
    implementation fg.deobf('maven.modrinth:lt2zd42r:TQrmq6gr')
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
